name: renderer

# The renderer's own tests, on the interpreter the Mac runs (the Command Line Tools' Python 3.9) and
# on Linux, and a sweep: small frames of random dates with made-up weather, then today and tomorrow
# with the live forecast. A date the renderer crashes on should fail here before the render job on
# the Mac meets it (intent/renderer-ci/). The sweep also runs every night, with a new seed.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          # setup-python has no arm64 build of 3.9 for macOS; the runner's own /usr/bin/python3 is the
          # Command Line Tools' 3.9, the interpreter the Mac renders with.
          - {os: macos-latest, python: "3.9", system: true}
          - {os: ubuntu-latest, python: "3.12"}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        if: ${{ !matrix.system }}
        with:
          python-version: ${{ matrix.python }}
      - name: A venv with the pinned versions
        run: |
          if [ "${{ matrix.system }}" = "true" ]; then PY=/usr/bin/python3; else PY=python; fi
          "$PY" -c "import sys; v = '%d.%d' % sys.version_info[:2]; print(sys.version); assert v == '${{ matrix.python }}', v"
          "$PY" -m venv venv
          ./venv/bin/pip install -q --upgrade pip
          ./venv/bin/pip install -q -r requirements.txt
          ./venv/bin/pip freeze
      - name: Unit tests
        run: ./venv/bin/python -m unittest discover -s tests
      - name: Astronomy and weather (scripts)
        run: |
          ./venv/bin/python tests/test_astro.py
          ./venv/bin/python tests/test_weather.py
      - name: The shore's reference set and its drawing (scripts; they render full-size frames)
        run: |
          ./venv/bin/python tests/test_shore_reference.py
          ./venv/bin/python tests/test_shore_render.py

  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: A venv with the pinned versions
        run: |
          python -m venv venv
          ./venv/bin/pip install -q --upgrade pip
          ./venv/bin/pip install -q -r requirements.txt
      - name: Random dates, made-up weather
        run: ./venv/bin/python tests/sweep.py --dates 10
      - name: Today and tomorrow, the live forecast
        if: always()
        run: ./venv/bin/python tests/sweep.py --live
